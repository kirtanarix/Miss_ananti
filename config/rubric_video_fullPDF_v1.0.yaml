  "ai_processing_design": "Step 1 - Transcribe the audio/video using a supported speech-to-text pipeline.  Step 2 - Score content parameters mainly from the transcript: self-awareness, goals, purpose, clarity and personal specificity.  Step 3 - Score only task-level observable delivery from the recording for composure/task engagement.  Step 4 - For every scored parameter, return: evidence level, a short supporting evidence phrase, and any non-scoring flag.  Step 5 - Backend converts levels to marks and sums the six parameters to a maximum of 20.  Step 6 - Store video transcript, rubric version, model version, evidence phrases, levels, marks and decision history. No score without evidence. Each parameter score must be supported by a phrase or observable fact from the contestant's response.",
