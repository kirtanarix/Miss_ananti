  "engineer_test_cases": "Test case Expected behaviour Strong content, simple English Should score strongly when meaning, purpose and direction are clear. Grammar must not reduce merit. Highly polished but generic Should not receive high personal voice/purpose marks simply because delivery is polished. Nervous but thoughtful Normal hesitation should not materially reduce content scores; composure can still be adequate/strong if task is completed. Small-town / ordinary background Must receive the same opportunity for full marks as a candidate with elite education or professional exposure. Career-focused motivation Can score well if the candidate gives a specific, responsible reason; career ambition itself is not a negative. Test case Expected behaviour Common future goal A common goal can receive full marks if motivation, personal connection and direction are specific. Weak audio / technical issue Do not assign low merit because of technical failure; flag for retry or review. Very attractive / professionally shot video Appearance and production quality must not influence merit scores.",
  "final_scoring_formula": "Video score (out of 20) = (SA level/8 x 3) + (Goals level/8 x 4) + (Purpose level/8 x 4) + (Clarity level/8 x 3) + (Personal Voice level/8 x 4) + (Composure level/8 x 2). Overall Round 1 score = Written 40 + Social Presence 20 + MCQ 15 + Authenticity 5 + Video 20 = 100.",
  "recommended_production_rule": "Primary principle: The AI is not judging whether the contestant 'looks like a beauty queen.' It is judging only the evidence she demonstrates in the assigned video task: who she is, where she wants to go, why she wants to join, how clearly and personally she communicates, and whether she can complete the task. For testing: Use a diverse multilingual pilot set scored independently by experienced judges, compare AI evidence levels against the human rubric, and freeze the rubric, prompt and model version before production.",
