{
  "questions": {
    "Q1": "Tell us about a time you took initiative for something that mattered to you. What did you do, and what did you learn?",
    "Q2": "Tell us about a time you disagreed with people around you, or changed your own mind, about something important. What was your reasoning?",
    "Q3": "What is one belief about beauty you would like girls to grow up without? Why, and how would you challenge it?",
    "Q4": "What is one problem you have personally noticed that affects people around you? Why does it matter to you, and what realistic first step would you take?",
    "Q5": "What is one thing about yourself you are actively working to improve, and what are you doing about it?"
  },
  "parameters": {
    "SA": {
      "name": "Self-awareness (SA)",
      "what_earns_marks": "Understands her own choices, motivations, limitations and learning.",
      "levels": {
        "0": "No evidence",
        "2": "Generic self-description",
        "4": "Names a real choice, motivation or limitation of her own",
        "6": "Explains what she learned, with a concrete example",
        "8": "Specific reflection showing how an experience changed what she does; consistent across answers"
      }
    },
    "CR": {
      "name": "Clarity and reasoning (CR)",
      "what_earns_marks": "Makes a clear point, in any language, and supports it with a reason.",
      "levels": {
        "0": "Off-topic or no point",
        "2": "Opinion with no reason, or point hard to follow",
        "4": "Clear point with a relevant reason",
        "6": "Reason grounded in her own observation or example",
        "8": "Considers another view or trade-off; clear logic throughout"
      }
    },
    "EV": {
      "name": "Empathy and values (EV)",
      "what_earns_marks": "Understands the people affected; respects choices different from her own.",
      "levels": {
        "0": "No evidence",
        "2": "Names a cause or label only",
        "4": "Identifies who is affected",
        "6": "Shows why or how it affects them",
        "8": "Recognises differing circumstances, respects others’ choices, considers consequences"
      }
    },
    "IJ": {
      "name": "Initiative and judgment (IJ)",
      "what_earns_marks": "Has acted, or proposes a realistic step within her means, at any scale.",
      "levels": {
        "0": "No action mentioned",
        "2": "Vague intention",
        "4": "Concrete action, feasibility unclear",
        "6": "Realistic step within her means that fits the problem, or has already acted",
        "8": "Has acted and reflected on the result, or realistic step plus how she’d know it worked"
      }
    },
    "CV": {
      "name": "Conviction and personal voice (CV)",
      "what_earns_marks": "Takes a clear position she owns; answers are specific to her life, not generic.",
      "levels": {
        "0": "No position; entirely generic",
        "2": "Slogans or stock phrases that could be anyone’s",
        "4": "Clear position or goal with at least one personal detail",
        "6": "Owns a clear stance; answers rooted in specific personal detail",
        "8": "Consistent conviction across answers, distinctly her own, persuasive"
      }
    }
  },
